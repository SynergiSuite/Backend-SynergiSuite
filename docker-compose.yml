services:
  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: development # <- run in dev mode
    container_name: synergisuite-api
    restart: unless-stopped
    ports:
      - '3002:3002'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=development
      - PORT=3002
      # Use the local PostgreSQL service when running through Compose.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_SSL=false
      # External storage settings are loaded from .env.
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=synergisuite-resources
      - NGROK_DOMAIN=${NGROK_DOMAIN:-}
    command: sh -c "rm -rf dist && npm run start:dev"
    volumes:
      - .:/app
      - /app/node_modules
      # - /app/dist
    networks:
      - app-network

  postgres:
    image: postgres:17-alpine
    container_name: synergisuite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-synergisuite}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: synergisuite-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - app-network

  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
  #   ports:
  #     - '5050:80'
  #   networks:
  #     - app-network

volumes:
  postgres-data:
  redis-data:

networks:
  app-network:
    driver: bridge
